# HBMDS edge proxy — static files served by nginx, /api + WebSocket proxied to Node.
# Rate limit protects the unauthenticated report/heartbeat endpoints per client IP
# (a lab machine legitimately sends < 1 req/s).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream hbmds {
    server server:3000;
}

server {
    listen 80;
    # --- TLS (recommended for campus networks) -----------------------------
    # 1. Put fullchain.pem + privkey.pem in deploy/certs
    # 2. Uncomment the certs volume in docker-compose.yml and the lines below
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # ------------------------------------------------------------------------

    root /usr/share/nginx/html;

    location = / { return 302 /exam/login.html; }

    # Static assets straight from nginx; anything else falls through to Node
    location / {
        try_files $uri $uri/ @node;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://hbmds;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO needs WebSocket upgrade headers
    location /socket.io/ {
        proxy_pass http://hbmds;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location @node {
        proxy_pass http://hbmds;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
